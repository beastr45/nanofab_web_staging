# ===================================================================
# THE "LOGO, FABRICATED" ANIMATION on the homepage
# (layouts/partials/fab-widget.html). One entry per process step, in
# order. Each step can name the machine that does it (its file name in
# content/machines/, without .md); the step then links to that card.
# Turn the whole section off with fabWidget = false in hugo.toml.
# ===================================================================

- name: Start
  label: Bare silicon wafer
  text: A polished, single-crystal silicon wafer. Everything else is built on it.

- name: Oxidize
  label: Thermal oxide
  machine: tube-furnace
  text: At about 1000 °C in oxygen, the surface grows a thin glassy layer of silicon dioxide.

- name: Coat
  label: Photoresist
  machine: spinner
  text: A puddle of light-sensitive polymer is spun into a film a micron thick.

- name: Expose
  label: UV exposure
  machine: maskless-stepper
  text: Ultraviolet light draws the pattern straight from a design file. No mask needed.

- name: Develop
  label: Develop
  machine: developer
  text: The developer washes away the exposed resist, opening windows to the layer underneath.

- name: Etch
  label: Plasma etch
  machine: reactive-ion-etcher
  text: A plasma etches through the open windows. The resist protects everything else.

- name: Strip
  label: Strip and inspect
  machine: photoresist-stripper
  text: The leftover resist is stripped away, and the pattern is in the wafer for good.
