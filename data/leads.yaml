# ===================================================================
# SYSTEM & SUBSYSTEM LEADS — shown on the /team/ page, grouped by the
# band of the machine they lead, and as "Lead" on each machine card.
#
# Same fields as data/officers.yaml:
#   name   required — the person’s name
#   role   required — what they lead, e.g. "Spinner — System Lead"
#                     or "RIE Gas Delivery — Subsystem Lead"
#   major  optional — degree program and/or year. Leave "" to hide.
#   email  optional — shows a clickable email. Leave "" to hide.
#   photo  optional — leave "" to show their initials instead.
#                     Photos go in static/images/officers/.
#   photoPosition
#          optional — only if a photo crops badly, e.g. "center top".
#
# TO ADD a lead:     copy a whole "- name:" block and edit it.
# TO REMOVE a lead:  delete their block.
# Leads appear in the order listed here.
#
# If this file ever has no entries, the subsection shows "Coming soon."
# ===================================================================

