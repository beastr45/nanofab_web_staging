# ===================================================================
# PARTNERS & SPONSORS — the Sponsors section on the homepage.
#
# These are engineering partners, not just suppliers: their engineers
# give design feedback and iterate with us, and they sponsor
# components. Write each "description" to say what they actually do
# with us, not just what they sell.
#
# TO ADD a partner:     copy a whole "- name:" block and edit it.
# TO REMOVE one:        delete their block, or comment out its lines.
#
# "logo" is optional:
#   logo: ""                            -> shows the name as text
#   logo: "/images/sponsors/name.png"   -> shows their logo
#
# "url" is optional — their website. The template renders it as the
# bare domain (idealvac.com) and makes the logo clickable.
#   linkLabel: "Get in touch"   -> overrides that link's text
#
# Logo files go in static/images/sponsors/, trimmed tight with no
# blank border. They render up to 56 px tall.
# ===================================================================

- name: Ideal Vac
  description: Vacuum hardware for the sputterers and the etcher. Their engineers review our chamber designs.
  logo: "/images/sponsors/ideal-vac.png"
  url: "https://www.idealvac.com/"

- name: Basler
  description: Machine vision cameras. Their engineers advise our metrology and alignment imaging.
  logo: "/images/sponsors/basler-logo.png"
  url: "https://www.baslerweb.com/"
