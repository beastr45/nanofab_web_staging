{{/* Inline icons. {{ partial "icon.html" "arrow" }}  — arrow | ne | x | big-arrow */}}

{{- else if eq . "ne" -}}<svg class="ne" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2 10L10 2M4 2h6v6" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
{{- else if eq . "x" -}}<svg viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
{{- else if eq . "big-arrow" -}}<svg viewBox="0 0 56 56" aria-hidden="true" focusable="false"><path d="M4 28h46M32 10l18 18-18 18" stroke="currentColor" stroke-width="2.5" fill="none"/></svg>
