{{/* A Markdown image ![Caption](/images/x.jpg) becomes a captioned
     figure. Paths starting with "/" get the site's base URL. */}}
{{ $src := .Destination }}
{{ if hasPrefix $src "/" }}{{ $src = strings.TrimPrefix "/" $src | relURL }}{{ end }}
<span class="figure">
  <img src="{{ $src }}" alt="{{ .Text }}" loading="lazy" decoding="async" />
  {{ with .Title | default .Text }}<span class="figure-caption">{{ . }}</span>{{ end }}
</span>
