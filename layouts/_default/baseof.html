<!DOCTYPE html>
<html lang="en-US">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{/* the circuitry along the sides; delete this line to turn it off */}}
  <script src="{{ "js/circuit.js" | relURL }}?v={{ substr (readFile "static/js/circuit.js" | md5) 0 10 }}" defer></script>
  <script src="{{ "js/site.js" | relURL }}?v={{ substr (readFile "static/js/site.js" | md5) 0 10 }}" defer></script>
</body>
</html>
