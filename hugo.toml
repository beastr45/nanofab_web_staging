# =====================================================================
# Minnesota Nanofabrication Club: site settings.
# Most routine edits (people, sponsors, machines, blog posts) do NOT
# happen here. See README.md, "Where everything lives".
# =====================================================================

# The live address. Keep the trailing slash. GitHub Actions overrides
# this with the real Pages URL when it builds.
baseURL = "https://minnesota-nanofabrication-club.github.io/nanofab_web/"
locale = "en-US"

# The club's name, spelled one way everywhere: <title>, link previews,
# structured data. It must not start with "University of Minnesota",
# "UMN" or "Gopher" (README, "UMN branding rules").
title = "Minnesota Nanofabrication Club"

enableRobotsTXT = true

# No tag or category pages.
disableKinds = ["taxonomy", "term"]

[sitemap]
  changefreq = ""
  priority = -1

# Blog posts live at /blog/<file-name>/.
[permalinks]
  blog = "/blog/:contentbasename/"

# ---------------------------------------------------------------------
# THE TOP NAVIGATION. Same list in the header, the mobile menu and the
# footer. `weight` sets the order. External links (the docs) open in a
# new tab and get a small arrow automatically.
# ---------------------------------------------------------------------
[menus]
  [[menus.main]]
    name = "Machines"
    pageRef = "/machines"
    weight = 10
  [[menus.main]]
    name = "Team"
    pageRef = "/team"
    weight = 20
  [[menus.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 30
  [[menus.main]]
    name = "Events"
    pageRef = "/events"
    weight = 35
  [[menus.main]]
    name = "Sponsors"
    url = "/#sponsors"
    weight = 40

[params]
  tagline = "University of Minnesota, Twin Cities"
  shortTitle = "Minnesota Nanofabrication Club"

  # What Google shows under the homepage title. Stay under 160 characters.
  description = "Nanofabrication at the University of Minnesota: a student club building a semiconductor fab, machine by machine. Lithography, thin films, doping, metrology."

  # Picture used when a page is shared (Discord, LinkedIn, iMessage).
  ogImage = "/images/lab/nf-lab-web.jpg"

  # The homepage hero photograph. Replace the file to change it.
  heroImage = "/images/lab/nf-lab-web.jpg"

  # The one-line headline on the homepage hero. A full stop at the end
  # is drawn in the accent colour.
  heroTitle = "We are building a fab"
  heroLead = "MNF is a team of undergrads building a nanofabrication facility from scratch. Every machine is designed, assembled, tested and documented by students."

  googleSiteVerification = ""

  # ---------------- Links ----------------
  discordURL = "https://discord.gg/JXfFCyUDd7"
  githubURL = "https://github.com/minnesota-nanofabrication-club"
  linkedinURL = "https://www.linkedin.com/company/minnesota-nanofabrication-club/"
  instagramURL = "https://www.instagram.com/minnesota_nanofab_club/?hl=en"
  contactEmail = "nanoclub@umn.edu"

  # ---------------- Incubator ----------------
  # The "Propose a project" button at the bottom of /machines/. Paste the
  # proposal form's link (Google Form, etc.). Empty = the button emails
  # contactEmail instead.
  incubatorFormURL = "https://docs.google.com/forms/d/e/1FAIpQLSc5nth3iapB76D00UKA63-9QRU7BNukXxdADJaXm54cQxhP3g/viewform"

  # ---------------- Events calendar ----------------
  # The /events/ page. calendarID is the club's PUBLIC Google Calendar ID
  # (Google Calendar -> Settings for the calendar -> Integrate calendar ->
  # Calendar ID; for a umn.edu account calendar it is just the address).
  # It powers the "Add to Google Calendar" and "iCal" subscribe buttons.
  # calendarAPIKey is optional: with it, the page also draws the month
  # grid and the upcoming list. README, "Events and the calendar".
  calendarID = ""
  calendarAPIKey = ""
  # Shown in the events page header. Leave "" to hide.
  eventsLocation = ""

  # ---------------- The documentation site ----------------
  # The separate mdBook site (repository: nanofab_docs). The "Docs"
  # link in the navigation points here, and every machine card links
  # to  docsURL + docsMachinePath + <machine file name> + ".html".
  # A machine can override its link with `docs:` in its front matter.
  docsURL = "https://beastr45.github.io/nano-book_staging/"
  docsMachinePath = "machines/"

  # ---------------- Logo ----------------
  logo = "/images/logo/mnfc-wafer-logo.png"
  logoAlt = "Minnesota Nanofabrication Club wafer logo"

  [params.umn]
    universityURL = "https://umn.edu"
    universityName = "University of Minnesota"
    collegeURL = "https://cse.umn.edu"
    collegeName = "College of Science and Engineering"
    # REQUIRED BY THE UNIVERSITY. Do not reword. README, "UMN branding rules".
    rsoDisclaimer = "This group is a Registered Student Organization and is independent from the University of Minnesota."
    # The official Block M RSO mark, once the club has the file. It renders
    # at the very bottom of the footer, beside the disclaimer, as required.
    rsoMark = ""

[markup.goldmark.renderer]
  unsafe = true
